<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሳሚ ፀሀይ - 41 ኮንከር እና ዶቤ ጨዋታ</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b6623;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* የላይኛው የቴሌብር እና ሂሳብ አሞሌ */
        .top-bar {
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            font-size: 11px;
            flex-shrink: 0;
        }
        .telebirr-badge {
            background: #008751;
            color: #fff;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid #ffd700;
            cursor: pointer;
        }
        .opponents-bar {
            display: flex;
            justify-content: space-around;
            padding: 4px;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .opponent-tag {
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            border: 1px solid #d4af37;
        }

        /* መሃል ጠረጴዛ እና ሰሌዳ */
        .table-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 4px;
            min-height: 0;
        }
        
        .downloaded-melts-board {
            width: 95%;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px dashed #d4af37;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
            padding: 4px;
            font-size: 10px;
            text-align: center;
        }

        .center-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .card-box {
            width: 48px;
            height: 70px;
            background: #fff;
            color: #000;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #ccc;
            text-align: center;
            cursor: pointer;
        }
        .card-box.deck {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-size: 9px;
            justify-content: center;
            align-items: center;
        }
        .card-box.joker-indicator {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            font-size: 9px;
            justify-content: center;
            align-items: center;
            border: 2px dashed #fff;
        }
        .card-box.red { color: #d90429; }

        /* የቀኝ በኩል ቁልፎች */
        .action-buttons-right {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .btn-game {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: bold;
        }
        .btn-game.pass { background: #ff4d4d; color: white; }
        .btn-game.dobe { background: #9c27b0; color: white; border: 1px solid #ffd700; }

        /* የታችኛው የተጫዋች እጅ እና መስመር */
        .player-section {
            background: rgba(0, 0, 0, 0.95);
            padding: 8px 4px;
            border-top: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        
        .thick-download-line {
            width: 100%;
            background: linear-gradient(90deg, #ff9900, #00cc66, #ff9900);
            color: #000;
            font-weight: bold;
            text-align: center;
            padding: 7px;
            font-size: 11px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 5px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        .hand-cards-row {
            display: flex;
            justify-content: center;
            gap: 3px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 3px;
        }
        .player-card {
            background: #ffffff;
            color: #000000;
            width: 40px;
            height: 68px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3px;
            font-weight: bold;
            font-size: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.15s;
            flex-shrink: 0;
            user-select: none;
        }
        .player-card.selected {
            transform: translateY(-12px);
            border: 2px solid #00ffcc;
            background-color: #e6ffff;
            z-index: 10;
        }
        .player-card.red { color: #d90429; }
    </style>
</head>
<body>

    <!-- የላይኛው የቴሌብር እና ሂሳብ አሞሌ -->
    <div class="top-bar">
        <span>☀️ <b>41 ኮንከር & ዶቤ</b></span>
        <span style="color: #ffd700;" id="walletBalance">ሂሳብ: 1,000 ETB</span>
        <div class="telebirr-badge" onclick="openTelebirrModal()">
            📱 0972226999 (ሳሚ)
        </div>
    </div>

    <div class="opponents-bar">
        <div class="opponent-tag">👤 Bella05 (13 ካርታ)</div>
        <div class="opponent-tag">👤 YaYa82 (13 ካርታ)</div>
    </div>

    <!-- መሃል ጠረጴዛ -->
    <div class="table-area">
        <div class="downloaded-melts-board" id="meltsBoard">
            <span style="color: #d4af37; font-weight: bold;">📥 የወረዱ ትሪሶች / ሩኖች (ሰሌዳ)</span>
            <span style="font-size: 9px; color: #aaa;">(የተጣለውን ማንሳት ወይም 41 ማሟላት ይቻላል)</span>
        </div>

        <div class="center-row">
            <div class="card-box red" onclick="pickDiscarded()">
                <div style="font-size: 8px; color: #555;">የተጣለ</div>
                <div style="font-size: 15px;">3♥</div>
                <div style="font-size: 8px; color: #008751;">አንሳ</div>
            </div>

            <div class="card-box joker-indicator">
                <div style="font-size: 13px;">🃏</div>
                <div style="font-size: 8px; font-weight: bold;">ጆከር (10 ነጥብ)</div>
            </div>

            <div class="card-box deck">
                ማከማቻ<br><b>22</b>
            </div>
        </div>

        <div class="action-buttons-right">
            <button class="btn-game pass" onclick="passTurn()">PASS</button>
            <button class="btn-game dobe" onclick="declareDobe()">ዶቤ (5)</button>
            <button class="btn-game" onclick="sortHand()">SORT</button>
            <button class="btn-game" style="background:#ff9900; color:black;" onclick="discardCard()">ጣል</button>
        </div>
    </div>

    <!-- የታችኛው የተጫዋች እጅ -->
    <div class="player-section">
        <div class="thick-download-line" onclick="downloadMelts()">
            ⬇️ 41 ሞልተው አውርድ (የመጀመሪያ ውርድ / ዶቤ / ጆከር) ⬇️
        </div>

        <div style="font-size: 10px; color: #00ffcc; margin-bottom: 3px;" id="ruleText">
            💡 13 ካርታዎች | ጆከር 10 ነጥብ | ዶቤ 5 ሲሆን እና ትሪስ ካለ እጥፍ!
        </div>

        <div class="hand-cards-row" id="playerHand"></div>
    </div>

    <script>
        // 13 የተጫዋች ካርታዎች (ጆከር 10 ነጥብ ተደርጓል)
        let myCards = [
            {val: 'J', suit: '♠', pts: 10, red: false},
            {val: '10', suit: '♦', pts: 10, red: true},
            {val: '9', suit: '♣', pts: 9, red: false},
            {val: '5', suit: '♥', pts: 5, red: true},
            {val: '5', suit: '♦', pts: 5, red: true},
            {val: '5', suit: '♣', pts: 5, red: false}, // የዶቤ 5 ካርታዎች ናሙና
            {val: '3', suit: '♣', pts: 3, red: false},
            {val: '2', suit: '♦', pts: 2, red: true},
            {val: 'JOKER', suit: '🃏', pts: 10, red: false, isJoker: true},
            {val: '4', suit: '♥', pts: 4, red: true},
            {val: '6', suit: '♠', pts: 6, red: false},
            {val: '7', suit: '♠', pts: 7, red: false},
            {val: 'K', suit: '♥', pts: 10, red: true}
        ];

        let selectedIndices = [];
        let hasDownloaded = false;

        function renderHand() {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';

            myCards.forEach((card, index) => {
                let cardDiv = document.createElement('div');
                cardDiv.className = card.red ? 'player-card red' : 'player-card';
                if (selectedIndices.includes(index)) {
                    cardDiv.classList.add('selected');
                }

                cardDiv.innerHTML = `
                    <div>${card.val}</div>
                    <div style="font-size: 10px; text-align: center;">${card.suit}</div>
                    <div style="transform: rotate(180deg);">${card.val}</div>
                `;

                cardDiv.addEventListener('click', () => {
                    const pos = selectedIndices.indexOf(index);
                    if (pos > -1) {
                        selectedIndices.splice(pos, 1);
                    } else {
                        selectedIndices.push(index);
                    }
                    renderHand();
                });

                container.appendChild(cardDiv);
            });
        }

        function sortHand() {
            myCards.sort((a, b) => b.pts - a.pts);
            selectedIndices = [];
            renderHand();
        }

        function openTelebirrModal() {
            let action = prompt("የቴሌብር የኪስ ቦርሳ (0972226999 - ሳሚ ፀሀይ):\n1. ገንዘብ ለማስገባት\n2. ገንዘብ ለማውጣት\n\nቁጥር 1 ወይም 2 ይምረጡ:");
            if (action === "1") {
                let amount = prompt("ለማስገባት የሚፈልጉትን መጠን በብር ያስገቡ:");
                if (amount) alert(`✅ በቴሌብር 0972226999 የተጠየቀው ${amount} ብር ገብቷል!`);
            } else if (action === "2") {
                let amount = prompt("ለማውጣት የሚፈልጉትን መጠን በብር ያስገቡ:");
                if (amount) alert(`✅ ${amount} ብር ተልኳል!`);
            }
        }

        function pickDiscarded() {
            alert("📥 የተጣለውን ካርታ አንስተዋል! (ህግ: ሰው የጣለውን ማንሳት ይቻላል)");
        }

        function declareDobe() {
            // ዶቤ ሲሆን 5 መሆን አለበት እና አንድ ትሪስ አብሮ ከሰራ እጥፍ ያሸንፋል
            alert("🔥 ዶቤ ታውጇል! (5 ቁጥር እና ትሪስ በመያዝዎ የዕጥፍ (Double) አሸናፊነት ተረጋግጧል!)");
        }

        function downloadMelts() {
            if (selectedIndices.length === 0) {
                alert("⚠️ እባክዎ ማውረድ የሚፈልጓቸውን ካርታዎች ይምረጡ!");
                return;
            }
            
            // ነጥብ ማስላት (ጆከር 10 ነጥብ ሆኖ ይሰላል)
            let totalPts = 0;
            let hasJoker = false;
            let hasTris = false;

            selectedIndices.forEach(i => {
                totalPts += myCards[i].pts;
                if (myCards[i].isJoker) hasJoker = true;
            });

            hasDownloaded = true;
            let msg = `✨ ውርድዎ ተቀባይነት አግኝቷል! (ድምር ነጥብ: ${totalPts})`;
            if (hasJoker) {
                msg += "\n🃏 ጆከር መሬት ላይ ስለወጣ: እጥፍ (Double) አሸንፈዋል/ያስበላሉ!";
            }
            alert(msg);
        }

        function discardCard() {
            if (selectedIndices.length === 1) {
                myCards.splice(selectedIndices[0], 1);
                selectedIndices = [];
                renderHand();
            } else {
                alert("እባክዎ የሚጥሉትን *አንድ* ካርታ ብቻ ይምረጡ!");
            }
        }

        function passTurn() {
            alert("⏭️ ተራዎ አልፏል!");
        }

        renderHand();
    </script>

</body>
</html>
